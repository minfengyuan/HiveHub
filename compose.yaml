services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hivehub
      POSTGRES_USER: hivehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hivehub -d hivehub"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://hivehub:${POSTGRES_PASSWORD}@db:5432/hivehub
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      target: web
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
